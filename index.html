<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulários com API</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/post.js" defer></script>
</head>
<body>
    <header>
        <h1>Academia de Atletas</h1>
        <p><small>Inscreva-se para participar do próximo campeonato</small></p>
    </header>

    <main>
    <section id="forms">
    <h2><strong class="m">Faça sua inscrição</strong></h2>
    <form id="form-atletas" method="get">
        <label for="title">Nome do atleta:</label>
        <input id="title" name="title" type="text" minlength="3" maxlength="120" required/> 

        <label for="esporte">Esporte:</label>
        <input id="esporte" name="esporte" type="text" required/>

        <label for="pais">País:</label>
        <input id="pais" name="pais" type="text" required/>

        <label for="idade">Idade:</label>
        <input id="idade" name="idade" type="number" required/>

        <label for="conquistas">Conquistas:</label>
        <input id="conquistas" name="conquistas" type="text" required/>

        <label for="imageUrl">URL da imagem:</label>
        <input id="imageUrl" name="imageUrl" type="url"/>

        <button type="submit">Cadastrar Atleta</button>
    </form>
    <p id="resposta"></p>
    </section>
    </main>
    <footer>
        <p>Prática de formulários HTML</p>
    </footer>
</body>
</html>
